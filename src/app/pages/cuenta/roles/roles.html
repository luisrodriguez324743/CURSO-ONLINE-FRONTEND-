<header class="crud-barra">
  <h2>Roles</h2>

  <form class="filtro" (submit)="$event.preventDefault(); buscarPorId()">
    <input [(ngModel)]="idFiltro" name="idFiltro" placeholder="Filtrar por ID" autocomplete="off" />
    <button type="submit" class="secundario" [disabled]="cargando()">Buscar</button>
    <button type="button" class="secundario" (click)="limpiarFiltro()" [disabled]="cargando()">
      Todos
    </button>
  </form>

  <button type="button" (click)="abrirCrear()">+ Crear</button>
</header>

@if (mensaje()) {
  <p class="mensaje" [class.error]="esError()">{{ mensaje() }}</p>
}

<div class="tabla-contenedor">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre del rol</th>
        <th>Descripción</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (fila of filas(); track fila.id_rol) {
        <tr>
          <td class="id">{{ fila.id_rol }}</td>
          <td>{{ fila.nombre_rol }}</td>
          <td>{{ fila.descripcion || '—' }}</td>
          <td class="acciones">
            <button type="button" class="terciario" (click)="abrirEditar(fila)" [disabled]="cargando()">Editar</button>
            <button type="button" class="peligro" (click)="eliminar(fila)" [disabled]="cargando()">Eliminar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

@if (popupAbierto()) {
  <div class="fondo-popup" (click)="cerrarPopup()">
    <form class="popup" (click)="$event.stopPropagation()" (ngSubmit)="guardar()">
      <h3>{{ modo() === 'crear' ? 'Crear rol' : 'Editar rol' }}</h3>

      <label class="campo">
        <span>Nombre del rol</span>
        <input [(ngModel)]="formulario.nombre_rol" name="nombre_rol" maxlength="50" required />
      </label>
      <label class="campo">
        <span>Descripción</span>
        <textarea
          [(ngModel)]="formulario.descripcion"
          name="descripcion"
          maxlength="255"
          rows="3"
        ></textarea>
      </label>

      <div class="popup-acciones">
        <button type="button" class="secundario" (click)="cerrarPopup()" [disabled]="cargando()">Cancelar</button>
        <button type="submit" [disabled]="cargando()">Guardar</button>
      </div>
    </form>
  </div>
}
